[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "burn-research-ffi"
version = "0.1.0"
description = "Python host package for the burn-research reference machine over ABI v1"
requires-python = ">=3.10"
dependencies = ["cffi>=1.17"]

[tool.maturin]
bindings = "cffi"
compatibility = "linux"
