[package]
name = "burn-research"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# --- BURN ---
burn = { version = "0.20.0", features = ["wgpu"] }
burn-wgpu = { version = "0.20.0" }
burn-ndarray = { version = "0.20.0" }

# --- WASM ---
wasm-bindgen = "0.2"
js-sys = "0.3"          # Untuk JS interop (SharedArrayBuffer, etc)
web-sys = { version = "0.3", features = ["console"] }

# --- SERIALISASI MINIMAL (hanya untuk state save/load, bukan runtime) ---
serde = { version = "1.0", features = ["derive"] }
bincode = { version = "2.0.1", features = ["serde"] }

# --- RANDOM ---
getrandom = { version = "0.3", features = ["wasm_js"] }
sha2 = "0.10.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde_json = "1.0"

[package.metadata.wasm-pack.profile.release]
# wasm-pack's bundled wasm-opt can reject valid multi-table output from the
# current wasm-bindgen toolchain before packaged artifact tests can run.
# Keep release WASM semantics unchanged and skip only that post-processing step.
wasm-opt = false
