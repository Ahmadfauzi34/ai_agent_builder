[package]
name = "burn-research"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# --- BURN ---
# 7a (PR7a): `burn` DIPAKAI (src/facade/tensor.rs, src/facade/wasm_types.rs) — tetap.
# Yang dihapus: `burn-wgpu` (0 import di src/), fitur "wgpu" pada `burn`,
# dan `web-sys` (0 pemakaian di src/). Backend adalah burn_ndarray::NdArray<f32>.
burn = { version = "0.20.0", default-features = false, features = ["std"] }
# Node 18 support: burn-ndarray default features include `simd`, which pulls
# macerator whose wasm32 backend unconditionally emits Relaxed SIMD (f32x4_relaxed_madd),
# an opcode Node 18 (V8 10.2) cannot compile. Drop `simd`; keep std + multi-threads.
# SIMD128 strict ops (matrixmultiply sgemm) are kept via .cargo/config.toml.
burn-ndarray = { version = "0.20.0", default-features = false, features = ["std", "multi-threads"] }

# --- WASM ---
wasm-bindgen = "0.2"
js-sys = "0.3"          # Untuk JS interop (SharedArrayBuffer, etc)

# --- SERIALISASI MINIMAL (hanya untuk state save/load, bukan runtime) ---
serde = { version = "1.0", features = ["derive"] }
bincode = { version = "2.0.1", features = ["serde"] }

# --- RANDOM ---
getrandom = { version = "0.3", features = ["wasm_js"] }
sha2 = "0.10.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde_json = "1.0"

[package.metadata.wasm-pack.profile.release]
# wasm-pack's bundled wasm-opt can reject valid multi-table output from the
# current wasm-bindgen toolchain before packaged artifact tests can run.
# Keep release WASM semantics unchanged and skip only that post-processing step.
wasm-opt = false
