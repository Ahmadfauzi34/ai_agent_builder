name: WasmLinear Residual Decomposition Research

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "ffi/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/wasm-linear-residual-decomposition-research.yml"
      - "scripts/research_wasm_linear_residual_decomposition.py"
      - "docs/wasm-linear-residual-decomposition-research.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm-linear-residual-decomposition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run WasmLinear residual decomposition research
        run: python scripts/research_wasm_linear_residual_decomposition.py

      - name: Upload WasmLinear residual decomposition report
        uses: actions/upload-artifact@v4
        with:
          name: wasm-linear-residual-decomposition-report
          path: wasm-linear-residual-decomposition-report.json
          if-no-files-found: error
