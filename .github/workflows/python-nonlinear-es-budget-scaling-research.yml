name: Python Nonlinear ES Budget Scaling Research

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "ffi/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/python-nonlinear-es-budget-scaling-research.yml"
      - "scripts/research_python_nonlinear_es_budget_scaling.py"
      - "docs/python-nonlinear-es-budget-scaling-research.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nonlinear-es-budget-scaling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research tooling
        run: python3 -m pip install --disable-pip-version-check "maturin==1.13.3" "cffi>=1.17,<2"

      - name: Run nonlinear ES search-budget scaling research
        run: python3 scripts/research_python_nonlinear_es_budget_scaling.py

      - name: Upload nonlinear ES budget report
        uses: actions/upload-artifact@v4
        with:
          name: python-nonlinear-es-budget-scaling-report
          path: python-nonlinear-es-budget-scaling-report.json
          if-no-files-found: error
