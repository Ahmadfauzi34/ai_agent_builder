name: Python Workload Research

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  batch-vs-row-research:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python research tooling
        run: python3 -m pip install --disable-pip-version-check "maturin==1.13.3" "cffi>=1.17,<2"

      - name: Run installed-wheel Python batch workload research
        run: python3 scripts/research_python_batch_workload.py

      - name: Upload Python batch workload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-batch-workload-report
          path: python-batch-workload-report.json
          if-no-files-found: ignore
