name: Python Optimizer Direct F32 Research

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  optimizer-direct-f32-research:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python research tooling
        run: python3 -m pip install --disable-pip-version-check "maturin==1.13.3" "cffi>=1.17,<2"

      - name: Run installed-wheel optimizer direct-f32 prototype
        run: python3 scripts/research_python_optimizer_direct_f32.py

      - name: Upload optimizer direct-f32 report
        uses: actions/upload-artifact@v4
        with:
          name: python-optimizer-direct-f32-report
          path: python-optimizer-direct-f32-report.json
          if-no-files-found: error
