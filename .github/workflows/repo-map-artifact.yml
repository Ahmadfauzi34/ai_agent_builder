name: Repo Map Artifact

on:
  pull_request:
    branches: [ "main" ]

jobs:
  repo-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate repository map
        run: python3 scripts/repo_map.py --format json > repo-map.indices-like.json
      - name: Upload repository map
        uses: actions/upload-artifact@v4
        with:
          name: repo-map-indices-like
          path: repo-map.indices-like.json
