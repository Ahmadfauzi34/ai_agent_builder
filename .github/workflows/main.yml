name: Rust AI CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check host target
        run: cargo check --lib --verbose

      - name: Clippy host library
        run: cargo clippy --lib --all-targets

      - name: Check WASM target
        run: cargo check --target wasm32-unknown-unknown --verbose

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Build WASM
        run: wasm-pack build --target web --out-dir pkg

      - name: Run host tests
        run: cargo test --lib

      - name: Report artifact size
        run: |
          echo "=== total pkg ==="
          du -sh pkg
          echo "=== wasm binary ==="
          ls -lh pkg/*.wasm || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: burn-wasm-output
          path: pkg/
