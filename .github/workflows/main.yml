name: Rust AI CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BINARYEN_VERSION: version_131
  BINARYEN_SHA256: b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate agent contract schema
        run: |
          python3 -m json.tool docs/agent-contracts.v1.json >/dev/null
          python3 -m json.tool docs/agent-interaction-contract.v1.json >/dev/null
          python3 -m json.tool docs/agent-fault-contract.v1.json >/dev/null
          python3 -m json.tool docs/agent-input-contract.v1.json >/dev/null
          python3 -m json.tool docs/agent-input-port.v1.json >/dev/null
          python3 -m json.tool docs/agent-input-port-consumer.v1.json >/dev/null
          python3 -m json.tool docs/agent-input-port-routing.v1.json >/dev/null
          python3 -m json.tool docs/agent-input-port-edge-binding.v1.json >/dev/null
          python3 -m json.tool docs/agent-semantic-lifecycle.v1.json >/dev/null
          python3 -m json.tool docs/agent-introspection-contract.v1.json >/dev/null
          python3 -m json.tool docs/agent-layer-catalog.v1.json >/dev/null
          python3 -m json.tool docs/proof-provenance.v1.json >/dev/null
          python3 -m json.tool docs/math-proof.v1.json >/dev/null
          python3 -m json.tool docs/resolution-runtime-bridge.v1.json >/dev/null
          python3 -m json.tool docs/runtime-resolution-evidence.v1.json >/dev/null
          python3 -m json.tool docs/runtime-evidence-interpretation.v1.json >/dev/null
          python3 -m json.tool docs/agent-response-intent.v1.json >/dev/null
          python3 -m json.tool docs/response-intent-execution-gate.v1.json >/dev/null
          python3 -m json.tool docs/response-dispatch-requirements.v1.json >/dev/null
          python3 -m json.tool docs/response-dispatch-request.v1.json >/dev/null
          python3 -m json.tool docs/response-dispatch-executor-preflight.v1.json >/dev/null
          python3 -m json.tool docs/unified-math-interaction.v1.json >/dev/null
          python3 -m json.tool docs/wasm-surface.v1.json >/dev/null
          python3 -m json.tool docs/host-support.v1.json >/dev/null

      - name: Audit repository mapper
        run: python3 -m unittest tests/test_repo_map.py

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Check host target
        run: cargo check --lib --verbose

      - name: Build native resolution runtime bridge probe
        run: cargo build --release --bin resolution_runtime_bridge_probe

      - name: Build native runtime resolution evidence probe
        run: cargo build --release --bin runtime_resolution_evidence_probe

      - name: Build native runtime resolution evidence adapter probe
        run: cargo build --release --bin runtime_resolution_evidence_adapter_probe

      - name: Build native runtime evidence interpretation probe
        run: cargo build --release --bin runtime_evidence_interpretation_probe

      - name: Build native agent response intent probe
        run: cargo build --release --bin agent_response_intent_probe

      - name: Build native response intent execution gate probe
        run: cargo build --release --bin response_intent_execution_gate_probe

      - name: Build native response dispatch requirements probe
        run: cargo build --release --bin response_dispatch_requirements_probe

      - name: Build native response dispatch request probe
        run: cargo build --release --bin response_dispatch_request_probe

      - name: Build native response dispatch executor preflight probe
        run: cargo build --release --bin response_dispatch_executor_preflight_probe

      - name: Clippy host library
        run: cargo clippy --lib --all-targets

      - name: Audit native Rust package consumer
        run: python3 scripts/audit_rust_package.py

      - name: Install Python FFI proof dependency
        run: python3 -m pip install --disable-pip-version-check "cffi>=1.17"

      - name: Check language-neutral FFI crate
        run: cargo check --manifest-path ffi/Cargo.toml

      - name: Audit Python CFFI semantic consumer
        run: python3 scripts/audit_python_ffi.py

      - name: Check WASM target
        run: cargo check --target wasm32-unknown-unknown --verbose

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Cache Binaryen
        id: cache-binaryen
        uses: actions/cache@v4
        with:
          path: ~/.cache/binaryen-${{ env.BINARYEN_VERSION }}
          key: binaryen-${{ runner.os }}-${{ runner.arch }}-${{ env.BINARYEN_VERSION }}-${{ env.BINARYEN_SHA256 }}

      - name: Install Binaryen
        if: steps.cache-binaryen.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          archive="binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/${archive}" \
            -o "/tmp/${archive}"
          echo "${BINARYEN_SHA256}  /tmp/${archive}" | sha256sum --check
          install_dir="$HOME/.cache/binaryen-${BINARYEN_VERSION}"
          rm -rf "$install_dir"
          mkdir -p "$install_dir"
          tar -xzf "/tmp/${archive}" --strip-components=1 -C "$install_dir"

      - name: Configure Binaryen
        run: echo "$HOME/.cache/binaryen-${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify Binaryen
        run: |
          set -euxo pipefail
          command -v wasm-opt
          wasm-opt --version

      - name: Build WASM
        run: wasm-pack build --target web --out-dir pkg

      - name: Audit packaged WASM surface
        run: python3 scripts/check_wasm_surface.py

      - name: Package Node host adapter
        run: node scripts/package_node_host.mjs pkg

      - name: Upload parsed WASM surface diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-surface-diagnostic
          path: pkg/wasm-surface.actual.json
          if-no-files-found: ignore

      - name: Run packaged WASM artifact audit
        run: node scripts/audit_wasm_artifact.mjs pkg

      - name: Run Node host adapter audit
        run: node scripts/audit_node_host.mjs pkg

      - name: Run ES CompiledGraph parameter-binding audit
        run: node scripts/research_es_compiled_graph_binding.mjs pkg

      - name: Run graph parameter-binding v1 artifact research
        run: node scripts/research_graph_parameter_binding.mjs pkg

      - name: Run ES graph objective loop research
        run: node scripts/research_es_graph_objective_loop.mjs pkg

      - name: Run ES graph checkpoint replay research
        run: node scripts/research_es_graph_checkpoint_replay.mjs pkg

      - name: Run custom Shift real-task research
        run: node scripts/research_shift_lag.mjs pkg

      - name: Run FeatureNorm retrieval research
        run: node scripts/research_feature_norm_retrieval.mjs pkg

      - name: Run FeatureNorm integration research
        run: node scripts/research_feature_norm_integration.mjs pkg

      - name: Run Numeric Kernel artifact research
        run: node scripts/research_numeric_kernel.mjs pkg

      - name: Run Tensor Transform artifact research
        run: node scripts/research_tensor_transform.mjs pkg

      - name: Run Linear Algebra artifact research
        run: node scripts/research_linear_algebra.mjs pkg

      - name: Run Statistics artifact research
        run: node scripts/research_statistics.mjs pkg

      - name: Run Reduction v1 artifact research
        run: node scripts/research_reduction.mjs pkg

      - name: Run Index Source v1 artifact research
        run: node scripts/research_index_source.mjs pkg

      - name: Run Comparison v1 artifact research
        run: node scripts/research_comparison.mjs pkg

      - name: Run Probability artifact research
        run: node scripts/research_probability.mjs pkg

      - name: Run Math Program artifact research
        run: node scripts/research_math_program.mjs pkg

      - name: Run Math Program v4 artifact research
        run: node scripts/research_math_program_v4.mjs pkg

      - name: Run Math Program v5 artifact research
        run: node scripts/research_math_program_v5.mjs pkg

      - name: Run Math Program v6 artifact research
        run: node scripts/research_math_program_v6.mjs pkg

      - name: Run Math Program v7 artifact research
        run: node scripts/research_math_program_v7.mjs pkg

      - name: Run Math Program v8 artifact research
        run: node scripts/research_math_program_v8.mjs pkg

      - name: Run Math Program v9 artifact research
        run: node scripts/research_math_program_v9.mjs pkg

      - name: Run post-v8 model composition audit
        run: node scripts/research_math_program_v8_model_composition.mjs pkg

      - name: Run index / predicate semantics audit
        run: node scripts/research_index_predicate_semantics.mjs pkg

      - name: Run post-v5 Math Program flexibility audit
        run: node scripts/research_math_program_flexibility.mjs pkg

      - name: Run Resolution / Effective Specification communication audit
        run: cargo test --test audit_resolution_effective_spec -- --nocapture

      - name: Run Resolution authorization / bulk-policy simulation audit
        run: cargo test --test audit_resolution_policy_simulation -- --nocapture

      - name: Run Resolution scoped-authority / stale-policy audit
        run: cargo test --test audit_resolution_authority_scope -- --nocapture

      - name: Run host tests
        run: cargo test --lib --tests

      - name: Report artifact size
        run: |
          echo "=== total pkg ==="
          du -sh pkg
          echo "=== wasm binary ==="
          ls -lh pkg/*.wasm || true

      - name: Upload native resolution runtime bridge probe
        uses: actions/upload-artifact@v4
        with:
          name: resolution-runtime-bridge-native-probe
          path: target/release/resolution_runtime_bridge_probe

      - name: Upload native runtime resolution evidence probe
        uses: actions/upload-artifact@v4
        with:
          name: runtime-resolution-evidence-native-probe
          path: target/release/runtime_resolution_evidence_probe

      - name: Upload native runtime resolution evidence adapter probe
        uses: actions/upload-artifact@v4
        with:
          name: runtime-resolution-evidence-adapter-probe
          path: target/release/runtime_resolution_evidence_adapter_probe

      - name: Upload native runtime evidence interpretation probe
        uses: actions/upload-artifact@v4
        with:
          name: runtime-evidence-interpretation-native-probe
          path: target/release/runtime_evidence_interpretation_probe

      - name: Upload native agent response intent probe
        uses: actions/upload-artifact@v4
        with:
          name: agent-response-intent-native-probe
          path: target/release/agent_response_intent_probe

      - name: Upload native response intent execution gate probe
        uses: actions/upload-artifact@v4
        with:
          name: response-intent-execution-gate-native-probe
          path: target/release/response_intent_execution_gate_probe

      - name: Upload native response dispatch requirements probe
        uses: actions/upload-artifact@v4
        with:
          name: response-dispatch-requirements-native-probe
          path: target/release/response_dispatch_requirements_probe

      - name: Upload native response dispatch request probe
        uses: actions/upload-artifact@v4
        with:
          name: response-dispatch-request-native-probe
          path: target/release/response_dispatch_request_probe

      - name: Upload native response dispatch executor preflight probe
        uses: actions/upload-artifact@v4
        with:
          name: response-dispatch-executor-preflight-native-probe
          path: target/release/response_dispatch_executor_preflight_probe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: burn-wasm-output
          path: pkg/
