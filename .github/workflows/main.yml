name: Rust AI CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BINARYEN_VERSION: version_131
  BINARYEN_SHA256: b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate agent contract schema
        run: |
          python3 -m json.tool docs/agent-contracts.v1.json >/dev/null
          python3 -m json.tool docs/multi-input-graph-plan.v1.json >/dev/null
          python3 -m json.tool docs/multi-input-plan-explain.v1.json >/dev/null
          python3 -m json.tool docs/multi-input-execution-trace.v1.json >/dev/null
          python3 -m json.tool docs/baseline-candidate-verification.v1.json >/dev/null
          python3 -m json.tool docs/transactional-graph-mutation.v1.json >/dev/null
          python3 -m json.tool docs/transactional-graph-checkpoint-branch.v1.json >/dev/null
          python3 -m json.tool docs/agent-interaction-contract.v1.json >/dev/null
          python3 -m json.tool docs/agent-fault-contract.v1.json >/dev/null
          python3 -m json.tool docs/agent-input-contract.v1.json >/dev/null
          python3 -m json.tool docs/agent-input-port.v1.json >/dev/null
          python3 -m json.tool docs/agent-input-port-consumer.v1.json >/dev/null
          python3 -m json.tool docs/agent-input-port-routing.v1.json >/dev/null
          python3 -m json.tool docs/agent-input-port-edge-binding.v1.json >/dev/null
          python3 -m json.tool docs/semantic-ingress-manifest.v1.json >/dev/null
          python3 -m json.tool docs/semantic-ingress-manifest.v2.json >/dev/null
          python3 -m json.tool docs/ingress-provenance.v1.json >/dev/null
          python3 -m json.tool docs/ingress-replay-ledger.v1.json >/dev/null
          python3 -m json.tool docs/host-execution-receipt.v1.json >/dev/null
          python3 -m json.tool docs/host-execution-receipt.v2.json >/dev/null
          python3 -m json.tool docs/host-checkpoint-restore.v1.json >/dev/null
          python3 -m json.tool docs/host-state-handoff.v1.json >/dev/null
          python3 -m json.tool docs/agent-semantic-lifecycle.v1.json >/dev/null
          python3 -m json.tool docs/agent-introspection-contract.v1.json >/dev/null
          python3 -m json.tool docs/agent-layer-catalog.v1.json >/dev/null
          python3 -m json.tool docs/proof-provenance.v1.json >/dev/null
          python3 -m json.tool docs/math-proof.v1.json >/dev/null
          python3 -m json.tool docs/resolution-runtime-bridge.v1.json >/dev/null
          python3 -m json.tool docs/runtime-resolution-evidence.v1.json >/dev/null
          python3 -m json.tool docs/runtime-evidence-interpretation.v1.json >/dev/null
          python3 -m json.tool docs/agent-response-intent.v1.json >/dev/null
          python3 -m json.tool docs/response-intent-execution-gate.v1.json >/dev/null
          python3 -m json.tool docs/response-dispatch-requirements.v1.json >/dev/null
          python3 -m json.tool docs/response-dispatch-request.v1.json >/dev/null
          python3 -m json.tool docs/response-dispatch-executor-preflight.v1.json >/dev/null
          python3 -m json.tool docs/revision-dispatch-execution-adapter.v1.json >/dev/null
          python3 -m json.tool docs/revision-execution-evidence-rejoin.v1.json >/dev/null
          python3 -m json.tool docs/graph-reverify-runtime-binding.v1.json >/dev/null
          python3 -m json.tool docs/graph-reverify-execution-adapter.v1.json >/dev/null
          python3 -m json.tool docs/unified-math-interaction.v1.json >/dev/null
          python3 -m json.tool docs/wasm-surface.v1.json >/dev/null
          python3 -m json.tool docs/runtime-surface.v1.json >/dev/null
          python3 -m json.tool docs/host-support.v1.json >/dev/null

      - name: Audit repository mapper
        run: python3 -m unittest tests/test_repo_map.py

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Check host target
        run: cargo check --lib --verbose

      - name: Build native resolution runtime bridge probe
        run: cargo build --release --bin resolution_runtime_bridge_probe

      - name: Build native runtime resolution evidence probe
        run: cargo build --release --bin runtime_resolution_evidence_probe

      - name: Build native runtime resolution evidence adapter probe
        run: cargo build --release --bin runtime_resolution_evidence_adapter_probe

      - name: Build native runtime evidence interpretation probe
        run: cargo build --release --bin runtime_evidence_interpretation_probe

      - name: Build native agent response intent probe
        run: cargo build --release --bin agent_response_intent_probe

      - name: Build native response intent execution gate probe
        run: cargo build --release --bin response_intent_execution_gate_probe

      - name: Build native response dispatch requirements probe
        run: cargo build --release --bin response_dispatch_requirements_probe
