name: Rust AI CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BINARYEN_VERSION: version_131
  BINARYEN_SHA256: b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate agent contract schema
        run: |
          python3 scripts/check_contract_registry.py
          python3 -m json.tool docs/contracts/agent-contracts.v1.json >/dev/null
          python3 -m json.tool docs/contracts/multi-input-graph-plan.v1.json >/dev/null
          python3 -m json.tool docs/contracts/multi-input-plan-explain.v1.json >/dev/null
          python3 -m json.tool docs/contracts/multi-input-execution-trace.v1.json >/dev/null
          python3 -m json.tool docs/contracts/baseline-candidate-verification.v1.json >/dev/null
          python3 -m json.tool docs/contracts/transactional-graph-mutation.v1.json >/dev/null
          python3 -m json.tool docs/contracts/transactional-graph-checkpoint-branch.v1.json >/dev/null
          python3 -m json.tool docs/contracts/agent-interaction-contract.v1.json >/dev/null
          python3 -m json.tool docs/contracts/agent-fault-contract.v1.json >/dev/null
          python3 -m json.tool docs/contracts/agent-input-contract.v1.json >/dev/null
          python3 -m json.tool docs/contracts/agent-input-port.v1.json >/dev/null
          python3 -m json.tool docs/contracts/agent-input-port-consumer.v1.json >/dev/null
          python3 -m json.tool docs/contracts/agent-input-port-routing.v1.json >/dev/null
          python3 -m json.tool docs/contracts/agent-input-port-edge-binding.v1.json >/dev/null
          python3 -m json.tool docs/contracts/semantic-ingress-manifest.v1.json >/dev/null
          python3 -m json.tool docs/contracts/semantic-ingress-manifest.v2.json >/dev/null
          python3 -m json.tool docs/contracts/ingress-provenance.v1.json >/dev/null
          python3 -m json.tool docs/contracts/ingress-replay-ledger.v1.json >/dev/null
          python3 -m json.tool docs/contracts/host-execution-receipt.v1.json >/dev/null
          python3 -m json.tool docs/contracts/host-execution-receipt.v2.json >/dev/null
          python3 -m json.tool docs/contracts/host-checkpoint-restore.v1.json >/dev/null
          python3 -m json.tool docs/contracts/host-state-handoff.v1.json >/dev/null
          python3 -m json.tool docs/contracts/agent-semantic-lifecycle.v1.json >/dev/null
          python3 -m json.tool docs/contracts/agent-introspection-contract.v1.json >/dev/null
          python3 -m json.tool docs/contracts/agent-layer-catalog.v1.json >/dev/null
          python3 -m json.tool docs/contracts/proof-provenance.v1.json >/dev/null
          python3 -m json.tool docs/contracts/math-proof.v1.json >/dev/null
          python3 -m json.tool docs/contracts/resolution-runtime-bridge.v1.json >/dev/null
          python3 -m json.tool docs/contracts/runtime-resolution-evidence.v1.json >/dev/null
          python3 -m json.tool docs/contracts/runtime-evidence-interpretation.v1.json >/dev/null
          python3 -m json.tool docs/contracts/agent-response-intent.v1.json >/dev/null
          python3 -m json.tool docs/contracts/response-intent-execution-gate.v1.json >/dev/null
          python3 -m json.tool docs/contracts/response-dispatch-requirements.v1.json >/dev/null
          python3 -m json.tool docs/contracts/response-dispatch-request.v1.json >/dev/null
          python3 -m json.tool docs/contracts/response-dispatch-executor-preflight.v1.json >/dev/null
          python3 -m json.tool docs/contracts/revision-dispatch-execution-adapter.v1.json >/dev/null
          python3 -m json.tool docs/contracts/revision-execution-evidence-rejoin.v1.json >/dev/null
          python3 -m json.tool docs/contracts/graph-reverify-runtime-binding.v1.json >/dev/null
          python3 -m json.tool docs/contracts/graph-reverify-execution-adapter.v1.json >/dev/null
          python3 -m json.tool docs/contracts/unified-math-interaction.v1.json >/dev/null
          python3 -m json.tool docs/contracts/wasm-surface.v1.json >/dev/null
          python3 -m json.tool docs/contracts/runtime-surface.v1.json >/dev/null
          python3 -m json.tool docs/contracts/host-support.v1.json >/dev/null

      - name: Audit repository mapper
        run: python3 -m unittest tests/test_repo_map.py

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check host target
        run: cargo check --lib --verbose

      - name: Build native probes
        run: cargo build --release --bins

      - name: Clippy host library
        run: cargo clippy --lib --all-targets

      - name: Audit native Rust package consumer
        run: python3 scripts/audit_rust_package.py

      - name: Install Python FFI proof dependency
        run: python3 -m pip install --disable-pip-version-check "cffi>=1.17"

      - name: Check language-neutral FFI crate
        run: cargo check --manifest-path ffi/Cargo.toml

      - name: Audit Python CFFI semantic consumer
        run: python3 scripts/audit_python_ffi.py

      - name: Check WASM target
        run: cargo check --target wasm32-unknown-unknown --verbose

      - name: Install wasm-pack
        shell: bash
        env:
          WASM_PACK_VERSION: v0.15.0
        run: |
          set -euxo pipefail
          # Replaces jetli/wasm-pack-action@v0.4.0 (2026-10-21): the action
          # moves the extracted binary with a cross-filesystem rename, which
          # fails with EXDEV on current runner images (/tmp and $HOME on
          # different mounts). A direct download + `install` copy into
          # $HOME/.cargo/bin is immune to EXDEV.
          archive="wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/${archive}" \
            -o "${{ runner.temp }}/${archive}"
          stage="${{ runner.temp }}/wasm-pack-install"
          rm -rf "$stage"
          mkdir -p "$stage"
          tar -xzf "${{ runner.temp }}/${archive}" -C "$stage"
          install -m 755 \
            "$stage/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" \
            "$HOME/.cargo/bin/wasm-pack"
          wasm-pack --version

      - name: Cache Binaryen
        id: cache-binaryen
        uses: actions/cache@v4
        with:
          path: ~/.cache/binaryen-${{ env.BINARYEN_VERSION }}
          key: binaryen-${{ runner.os }}-${{ runner.arch }}-${{ env.BINARYEN_VERSION }}-${{ env.BINARYEN_SHA256 }}

      - name: Install Binaryen
        if: steps.cache-binaryen.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          archive="binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/${archive}" \
            -o "/tmp/${archive}"
          echo "${BINARYEN_SHA256}  /tmp/${archive}" | sha256sum --check
          install_dir="$HOME/.cache/binaryen-${BINARYEN_VERSION}"
          rm -rf "$install_dir"
          mkdir -p "$install_dir"
          tar -xzf "/tmp/${archive}" --strip-components=1 -C "$install_dir"

      - name: Configure Binaryen
        run: echo "$HOME/.cache/binaryen-${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify Binaryen
        run: |
          set -euxo pipefail
          command -v wasm-opt
          wasm-opt --version

      - name: Build WASM
        run: wasm-pack build --target web --out-dir pkg

      - name: Audit packaged WASM surface
        run: python3 scripts/check_wasm_surface.py

      - name: Package Node host adapter
        run: node scripts/package_node_host.mjs pkg

      - name: Check packaged README local links
        run: node scripts/check_distribution_links.mjs pkg

      - name: Run distribution smoke test
        run: node scripts/smoke_distribution.mjs pkg

      - name: Audit MathProgram Fase 2 (entry validation + unchecked steps) at the wasm boundary
        run: node scripts/audit_math_program_fase2.mjs pkg

      - name: Audit WASM memory oracle (deterministic leak detection via linear memory pages)
        run: node scripts/audit_wasm_memory.mjs pkg

      - name: Audit WASM OOM boundary (graceful failure at the 4 GiB ceiling)
        run: node scripts/audit_wasm_oom.mjs pkg

      - name: Generate WASM runtime surface snapshot from the packaged runtime
        run: node scripts/generate_wasm_surface_actual.mjs pkg --write

      - name: Verify WASM runtime surface snapshot against the packaged runtime
        run: node scripts/generate_wasm_surface_actual.mjs pkg --check

      - name: Upload packaged Node host bundle
        uses: actions/upload-artifact@v4
        with:
          name: node-host-package
          path: pkg/
          if-no-files-found: error

      - name: Zip packaged bundle for portable download
        run: |
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          zip -r "burn-research-pkg-${SHORT_SHA}.zip" pkg/
          ls -la burn-research-pkg-*.zip

      - name: Upload portable packaged bundle zip
        uses: actions/upload-artifact@v4
        with:
          name: burn-research-pkg-zip
          path: burn-research-pkg-*.zip
          if-no-files-found: error

      - name: Upload WASM runtime surface diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-surface-diagnostic
          path: |
            pkg/wasm-surface.actual.json
            pkg/wasm-surface.bindings.actual.json
          if-no-files-found: ignore

      - name: Run packaged WASM artifact audit
        run: node scripts/audit_wasm_artifact.mjs pkg

      - name: Run interactive multi-input ingress audit
        run: node scripts/audit_interactive_multi_input_ingress.mjs pkg

      - name: Run signed ingress provenance audit
        run: node scripts/audit_signed_ingress_provenance.mjs pkg

      - name: Run durable signed ingress audit
        run: node scripts/audit_durable_signed_ingress.mjs pkg

      - name: Run state-bound signed ingress audit
        run: node scripts/audit_state_bound_signed_ingress.mjs pkg

      - name: Run Node host adapter audit
        run: node scripts/audit_node_host.mjs pkg

      - name: Run ES CompiledGraph parameter-binding audit
        run: node scripts/research_es_compiled_graph_binding.mjs pkg

      - name: Run graph parameter-binding v1 artifact research
        run: node scripts/research_graph_parameter_binding.mjs pkg

      - name: Run ES graph objective loop research
        run: node scripts/research_es_graph_objective_loop.mjs pkg

      - name: Run ES graph checkpoint replay research
        run: node scripts/research_es_graph_checkpoint_replay.mjs pkg

      - name: Run custom Shift real-task research
        run: node scripts/research_shift_lag.mjs pkg

      - name: Run FeatureNorm retrieval research
        run: node scripts/research_feature_norm_retrieval.mjs pkg

      - name: Run FeatureNorm integration research
        run: node scripts/research_feature_norm_integration.mjs pkg

      - name: Run Numeric Kernel artifact research
        run: node scripts/research_numeric_kernel.mjs pkg

      - name: Run Tensor Transform artifact research
        run: node scripts/research_tensor_transform.mjs pkg

      - name: Run Linear Algebra artifact research
        run: node scripts/research_linear_algebra.mjs pkg

      - name: Run Statistics artifact research
        run: node scripts/research_statistics.mjs pkg

      - name: Run Reduction v1 artifact research
        run: node scripts/research_reduction.mjs pkg

      - name: Run Index Source v1 artifact research
        run: node scripts/research_index_source.mjs pkg

      - name: Run Comparison v1 artifact research
        run: node scripts/research_comparison.mjs pkg

      - name: Run Probability artifact research
        run: node scripts/research_probability.mjs pkg

      - name: Run Math Program artifact research
        run: node scripts/research_math_program.mjs pkg

      - name: Run Math Program v4 artifact research
        run: node scripts/research_math_program_v4.mjs pkg

      - name: Run Math Program v5 artifact research
        run: node scripts/research_math_program_v5.mjs pkg

      - name: Run Math Program v6 artifact research
        run: node scripts/research_math_program_v6.mjs pkg

      - name: Run Math Program v7 artifact research
        run: node scripts/research_math_program_v7.mjs pkg

      - name: Run Math Program v8 artifact research
        run: node scripts/research_math_program_v8.mjs pkg

      - name: Run Math Program v9 artifact research
        run: node scripts/research_math_program_v9.mjs pkg

      - name: Run post-v8 model composition audit
        run: node scripts/research_math_program_v8_model_composition.mjs pkg

      - name: Run index / predicate semantics audit
        run: node scripts/research_index_predicate_semantics.mjs pkg

      - name: Run post-v5 Math Program flexibility audit
        run: node scripts/research_math_program_flexibility.mjs pkg

      - name: Run Resolution / Effective Specification communication audit
        run: cargo test --test audit_resolution_effective_spec -- --nocapture

      - name: Run Resolution authorization / bulk-policy simulation audit
        run: cargo test --test audit_resolution_policy_simulation -- --nocapture

      - name: Run Resolution scoped-authority / stale-policy audit
        run: cargo test --test audit_resolution_authority_scope -- --nocapture

      - name: Run host tests
        run: cargo test --lib --tests

      - name: Report artifact size
        run: |
          echo "=== total pkg ==="
          du -sh pkg
          echo "=== wasm binary ==="
          ls -lh pkg/*.wasm || true

      - name: Upload native resolution runtime bridge probe
        uses: actions/upload-artifact@v4
        with:
          name: resolution-runtime-bridge-native-probe
          path: target/release/resolution_runtime_bridge_probe

      - name: Upload native runtime resolution evidence probe
        uses: actions/upload-artifact@v4
        with:
          name: runtime-resolution-evidence-native-probe
          path: target/release/runtime_resolution_evidence_probe

      - name: Upload native runtime resolution evidence adapter probe
        uses: actions/upload-artifact@v4
        with:
          name: runtime-resolution-evidence-adapter-probe
          path: target/release/runtime_resolution_evidence_adapter_probe

      - name: Upload native runtime evidence interpretation probe
        uses: actions/upload-artifact@v4
        with:
          name: runtime-evidence-interpretation-native-probe
          path: target/release/runtime_evidence_interpretation_probe

      - name: Upload native agent response intent probe
        uses: actions/upload-artifact@v4
        with:
          name: agent-response-intent-native-probe
          path: target/release/agent_response_intent_probe

      - name: Upload native response intent execution gate probe
        uses: actions/upload-artifact@v4
        with:
          name: response-intent-execution-gate-native-probe
          path: target/release/response_intent_execution_gate_probe

      - name: Upload native response dispatch requirements probe
        uses: actions/upload-artifact@v4
        with:
          name: response-dispatch-requirements-native-probe
          path: target/release/response_dispatch_requirements_probe

      - name: Upload native response dispatch request probe
        uses: actions/upload-artifact@v4
        with:
          name: response-dispatch-request-native-probe
          path: target/release/response_dispatch_request_probe

      - name: Upload native response dispatch executor preflight probe
        uses: actions/upload-artifact@v4
        with:
          name: response-dispatch-executor-preflight-native-probe
          path: target/release/response_dispatch_executor_preflight_probe

      - name: Upload native revision dispatch execution adapter probe
        uses: actions/upload-artifact@v4
        with:
          name: revision-dispatch-execution-adapter-native-probe
          path: target/release/revision_dispatch_execution_adapter_probe

      - name: Upload native revision execution evidence rejoin probe
        uses: actions/upload-artifact@v4
        with:
          name: revision-execution-evidence-rejoin-native-probe
          path: target/release/revision_execution_evidence_rejoin_probe

      - name: Upload native graph reverify runtime binding probe
        uses: actions/upload-artifact@v4
        with:
          name: graph-reverify-runtime-binding-native-probe
          path: target/release/graph_reverify_runtime_binding_probe

      - name: Upload native graph reverify execution adapter probe
        uses: actions/upload-artifact@v4
        with:
          name: graph-reverify-execution-adapter-native-probe
          path: target/release/graph_reverify_execution_adapter_probe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: burn-wasm-output
          path: pkg/

  agent-pack:
    name: Agent pack gate (builder + regression + MANIFEST)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download packaged bundle zip
        uses: actions/download-artifact@v4
        with:
          name: burn-research-pkg-zip

      - name: Unpack packaged bundle
        run: |
          set -euxo pipefail
          unzip -q burn-research-pkg-*.zip
          ls pkg/burn_research_bg.wasm pkg/interactive_multi_input_ingress.mjs

      # The builder regenerates helper/MANIFEST.json from the engine
      # bundle. On a clean checkout it must come out byte-identical:
      # any diff means the committed pins are stale (the engine changed
      # without regenerating). Remedy: run the builder locally and
      # commit the regenerated helper/MANIFEST.json.
      # This check is meaningful because CI wasm builds are
      # byte-reproducible for identical Rust source (verified
      # 2026-10-28: the PR #395 bundle hashes exactly the committed
      # pins). A Rust toolchain move that changes bytes will also trip
      # it — that is the gate working, not a false alarm: regenerate
      # and commit.
      - name: Build agent pack from the CI bundle
        run: |
          set -euxo pipefail
          node scripts/build_agent_pack.mjs --out "${{ runner.temp }}/agent-pack" --engine pkg

      - name: Check helper/MANIFEST.json is in sync with the built engine
        run: |
          set -euxo pipefail
          git diff --exit-code -- helper/MANIFEST.json

      - name: Run agent-pack regression gate
        env:
          BURN_WASM_PKG_DIR: ${{ github.workspace }}/pkg
        run: node helper/bin/regression.mjs

      # Standalone-pack self-test: runs WITHOUT BURN_WASM_PKG_DIR, so
      # engine/catalog resolution inside the pack must work on its own
      # (a missing engine-audit candidate once crashed every
      # shape-dependent tool here — see lib/engine.mjs).
      - name: Run built-pack regression (standalone, no env override)
        run: node "${{ runner.temp }}/agent-pack/bin/regression.mjs"

      - name: Run engine hardening gate
        env:
          BURN_WASM_PKG_DIR: ${{ github.workspace }}/pkg
        run: node helper/bin/engine_hardening_test.mjs

      - name: Run autodiff proof gate
        env:
          BURN_WASM_PKG_DIR: ${{ github.workspace }}/pkg
        run: node helper/bin/autodiff.mjs prove-rules

      # Distribution (lane #4): everything above is the gate; the steps
      # below only run on main, after the gate passes, and publish the
      # built pack itself. On PRs the job still runs the gates but
      # publishes nothing (github.ref is refs/pull/N/merge there).
      # The release is rolling: one tag (agent-pack-latest, an anchor)
      # and one asset with a stable name (burn-math-agent-pack.zip),
      # overwritten on every main push, so the download URL never
      # changes:
      #   https://github.com/Ahmadfauzi34/ai_agent_builder/releases/download/agent-pack-latest/burn-math-agent-pack.zip
      # Traceability lives inside the zip: MANIFEST.json carries
      # pack_version = the source commit SHA plus the engine pins.
      # Publishing uses only the preinstalled gh CLI and the default
      # GITHUB_TOKEN (no third-party action); if the token ever lacks
      # contents:write, only these last steps fail — the gates above
      # have already passed.
      - name: Build the release pack (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          set -euxo pipefail
          node scripts/build_agent_pack.mjs --out "${{ runner.temp }}/burn-math-agent-pack" --engine pkg --version "${{ github.sha }}"
          cd "${{ runner.temp }}"
          zip -r -q burn-math-agent-pack.zip burn-math-agent-pack
          ls -la burn-math-agent-pack.zip

      - name: Upload release pack as CI artifact (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: burn-math-agent-pack
          path: ${{ runner.temp }}/burn-math-agent-pack.zip

      # GH_REPO is required here: this step runs from runner.temp,
      # which is not a git repository, so without it gh cannot discover
      # the target repo from a git remote — the first main run failed
      # exactly this way ("failed to run git: fatal: not a git
      # repository"). With GH_REPO set, gh needs no git discovery at all.
      - name: Publish to rolling release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euxo pipefail
          cd "${{ runner.temp }}"
          # Create the rolling release once; on later runs the view
          # succeeds. The trailing `|| true` covers two main pushes
          # racing the first creation (upload below stays strict).
          gh release view agent-pack-latest >/dev/null 2>&1 || \
            gh release create agent-pack-latest \
              --title "Burn-math agent pack (latest)" \
              --notes "Rolling build of the burn-math agent pack from main, published after the agent-pack gate passes. Each asset is the full standalone pack (tools + engine bundle + contracts index); MANIFEST.json inside pins the source commit and the engine bytes." || true
          gh release upload agent-pack-latest burn-math-agent-pack.zip --clobber
          gh release edit agent-pack-latest \
            --notes "Rolling build of the burn-math agent pack from main, published after the agent-pack gate passes. Latest source commit: ${{ github.sha }}. Each asset is the full standalone pack (tools + engine bundle + contracts index); MANIFEST.json inside pins the source commit and the engine bytes."

  node18-smoke:
    name: Node 18 distribution smoke test
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Download packaged bundle zip
        uses: actions/download-artifact@v4
        with:
          name: burn-research-pkg-zip

      - name: Unpack packaged bundle
        run: |
          set -euxo pipefail
          unzip -q burn-research-pkg-*.zip
          ls pkg/interactive_multi_input_ingress.mjs

      # Regression gate for Node 18 support: the packaged WASM must not
      # contain a Relaxed SIMD opcode (Node 18 / V8 10.2 cannot compile
      # f32x4_relaxed_madd, prefixed opcode 263). If a future dependency
      # reintroduces one, this smoke test fails here instead of on a
      # Node 18 host.
      - name: Run distribution smoke test under Node 18
        run: node scripts/smoke_distribution.mjs pkg

      # Regression gate for the Node 18 crypto trap (lane #2, 2026-10-28):
      # engine.mjs loads wasm in-process, and Node 18 ESM sees
      # globalThis.crypto as undefined, so the first thread_rng use
      # (ParamId at layer creation) panicked with RuntimeError: unreachable.
      # prove-rules exercises exactly that path (in-process forward via
      # engine.mjs); without the crypto polyfill it fails 0/22 here.
      - name: Prove autodiff rules under Node 18
        run: BURN_WASM_PKG_DIR=pkg node helper/bin/autodiff.mjs prove-rules

  supply-chain-audit:
    name: Supply-chain audit (cargo audit)
    runs-on: ubuntu-latest
    # rustsec/audit-check posts result annotations via the Checks API.
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Regression gate for the 2026-10-16 `zip` yank incident
      # (RUSTSEC-2026-0367 / -0368 / -0369). Fails CI when Cargo.lock
      # pins any crate with a published RustSec advisory.
      - name: Run cargo audit against RustSec advisory DB
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
