name: Rust AI CI (Advanced)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Cancel run yang redundant (push baru saat run lama masih jalan)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Budget size dalam bytes (100MB = 104857600)
  WASM_SIZE_BUDGET: 104857600

jobs:
  # ============================================================
  # JOB 1: Lint, Security & Format (Gatekeeper — cepat & murah)
  # ============================================================
  lint-and-security:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write  # Untuk upload SARIF ke GitHub Security tab
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # 1a. Format check — gagal CI kalau kode belum di-fmt
      - name: Check formatting
        run: cargo fmt --all -- --check

      # 1b. Clippy strict — lint + auto-fix suggestion + SARIF output
      - name: Run Clippy (Strict)
        run: |
          rustup component add clippy
          cargo clippy --all-targets --all-features -- -D warnings \
            -W clippy::pedantic \
            -W clippy::nursery \
            -W clippy::unwrap_used \
            -W clippy::expect_used
        # Kalau mau SARIF upload (butuh cargo-binstall atau build dari source):
        # cargo clippy --all-targets --all-features --message-format=json | clippy-sarif > clippy.sarif

      # 1c. Dependency Audit — cek crate yang punya CVE
      - name: Audit dependencies
        uses: actions-rust-lang/audit@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 1d. Cargo Deny — cek license, banned crates, duplicate dependencies
      - name: Check cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v1
        with:
          command: check licenses bans advisories sources

  # ============================================================
  # JOB 2: Build & Test Native (x86_64)
  # ============================================================
  build-and-test-native:
    runs-on: ubuntu-latest
    needs: lint-and-security
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # Build & check native target
      - name: Check native target
        run: cargo check --verbose

      - name: Build native (release)
        run: cargo build --release --verbose

      # Test semua: unit, integration, doc tests
      - name: Run all tests
        run: cargo test --all-features --verbose

      # Coverage report dengan cargo-llvm-cov
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # Build docs — gagal kalau ada broken doc-link
      - name: Build documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  # ============================================================
  # JOB 3: Build WASM + Optimize + Budget Guard
  # ============================================================
  build-and-test-wasm:
    runs-on: ubuntu-latest
    needs: lint-and-security
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # 3a. Check WASM target (fast fail sebelum build berat)
      - name: Check WASM target
        run: cargo check --target wasm32-unknown-unknown --verbose

      # 3b. Install wasm-pack
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      # 3c. Build WASM untuk web
      - name: Build WASM
        run: wasm-pack build --target web --out-dir pkg --release

      # 3d. Install wasm-opt (Binaryen) untuk shrink binary
      - name: Install wasm-opt
        run: |
          sudo apt-get update && sudo apt-get install -y binaryen

      - name: Optimize WASM with wasm-opt
        run: |
          for wasm in pkg/*.wasm; do
            echo "Optimizing $wasm ..."
            wasm-opt -O4 -o "$wasm.opt" "$wasm"
            mv "$wasm.opt" "$wasm"
          done

      # 3e. Generate SBOM (Software Bill of Materials)
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          format: "spdx-json"
          output: "pkg/sbom.spdx.json"

      # 3f. Generate checksums untuk verifikasi integritas
      - name: Generate checksums
        run: |
          cd pkg
          sha256sum *.wasm > checksums.sha256
          cat checksums.sha256

      # 3g. Size report + budget guard (gagal CI kalau melebihi budget)
      - name: Report artifact size & enforce budget
        run: |
          echo "=== Total pkg ==="
          du -sh pkg
          echo ""
          echo "=== WASM binary ==="
          ls -lh pkg/*.wasm || true
          echo ""
          echo "=== Per-file size (bytes) ==="
          find pkg -name "*.wasm" -exec ls -l {} \;
          echo ""
          echo "=== Budget Check ==="
          TOTAL_SIZE=$(du -sb pkg | cut -f1)
          echo "Total size: $TOTAL_SIZE bytes"
          echo "Budget: ${{ env.WASM_SIZE_BUDGET }} bytes"
          if [ "$TOTAL_SIZE" -gt "${{ env.WASM_SIZE_BUDGET }}" ]; then
            echo "❌ ERROR: Build exceeds size budget!"
            exit 1
          else
            echo "✅ Size budget OK"
          fi

      # 3h. Simpan artifact dengan metadata
      - name: Upload WASM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: burn-wasm-output-${{ github.run_id }}
          path: |
            pkg/
            !pkg/.gitignore
          retention-days: 30
          if-no-files-found: error

  # ============================================================
  # JOB 4: WASM Browser Test (Headless) — Optional tapi solid
  # ============================================================
  test-wasm-browser:
    runs-on: ubuntu-latest
    needs: build-and-test-wasm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      # Butuh Chrome/Firefox headless untuk wasm-pack test
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      # Jalankan test di browser headless (kalau project punya wasm tests)
      - name: Run WASM browser tests
        run: wasm-pack test --headless --chrome
        continue-on-error: true  # Hapus baris ini kalau wasm test wajib pass

  # ============================================================
  # JOB 5: Release Draft (hanya jalan di push ke main)
  # ============================================================
  release-draft:
    runs-on: ubuntu-latest
    needs: [build-and-test-native, build-and-test-wasm]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: burn-wasm-output-${{ github.run_id }}
          path: pkg/

      - name: Create Release Draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: wasm-build-${{ github.run_number }}
          name: "WASM Build #${{ github.run_number }}"
          files: |
            pkg/*.wasm
            pkg/checksums.sha256
            pkg/sbom.spdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
