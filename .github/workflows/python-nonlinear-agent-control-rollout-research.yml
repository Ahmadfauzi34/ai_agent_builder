name: Python Nonlinear Agent Control Rollout Research

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nonlinear-agent-control-rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research tooling
        run: python3 -m pip install --disable-pip-version-check "maturin==1.13.3" "cffi>=1.17,<2"

      - name: Run nonlinear Python agent control rollout research
        run: python3 scripts/research_python_nonlinear_agent_control_rollout.py

      - name: Upload nonlinear agent control rollout report
        uses: actions/upload-artifact@v4
        with:
          name: python-nonlinear-agent-control-rollout-report
          path: python-nonlinear-agent-control-rollout-report.json
          if-no-files-found: error
