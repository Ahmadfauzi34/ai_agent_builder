name: Python F32 Buffer Fast Path Research

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "ffi/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/python-f32-buffer-fast-path-research.yml"
      - "scripts/research_python_f32_buffer_fast_path.py"
      - "docs/python-f32-buffer-fast-path-research.md"
  workflow_dispatch:

jobs:
  f32-buffer-fast-path-research:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python research tooling
        run: python3 -m pip install --disable-pip-version-check "maturin==1.13.3" "cffi>=1.17,<2"

      - name: Run installed-wheel f32 buffer fast-path research
        run: python3 scripts/research_python_f32_buffer_fast_path.py

      - name: Upload f32 buffer fast-path report
        uses: actions/upload-artifact@v4
        with:
          name: python-f32-buffer-fast-path-report
          path: python-f32-buffer-fast-path-report.json
          if-no-files-found: error
