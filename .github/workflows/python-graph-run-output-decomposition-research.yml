name: Python Graph Run Output Decomposition Research

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  python-graph-run-output-decomposition:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python research tooling
        run: python3 -m pip install --disable-pip-version-check "maturin==1.13.3" "cffi>=1.17,<2"

      - name: Run installed-wheel graph run/output decomposition
        run: python3 scripts/research_python_graph_run_output_decomposition.py

      - name: Upload graph run/output decomposition report
        uses: actions/upload-artifact@v4
        with:
          name: python-graph-run-output-decomposition-report
          path: python-graph-run-output-decomposition-report.json
          if-no-files-found: error
