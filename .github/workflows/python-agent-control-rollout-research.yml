name: Python Agent Control Rollout Research

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "ffi/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/python-agent-control-rollout-research.yml"
      - "scripts/research_python_agent_control_rollout.py"
      - "docs/python-agent-control-rollout-research.md"
  workflow_dispatch:

jobs:
  python-agent-control-rollout:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python research tooling
        run: python3 -m pip install --disable-pip-version-check "maturin==1.13.3" "cffi>=1.17,<2"

      - name: Run installed-wheel agent control rollout research
        run: python3 scripts/research_python_agent_control_rollout.py

      - name: Upload agent control rollout report
        uses: actions/upload-artifact@v4
        with:
          name: python-agent-control-rollout-report
          path: python-agent-control-rollout-report.json
          if-no-files-found: error
