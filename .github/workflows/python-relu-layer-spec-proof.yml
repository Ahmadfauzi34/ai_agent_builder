name: Python ReLU Layer Spec Proof

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "ffi/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/python-relu-layer-spec-proof.yml"
      - "scripts/audit_python_relu_layer_spec.py"
      - "docs/python-relu-layer-spec-proof.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-wheel-relu-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install wheel proof tooling
        run: python3 -m pip install --disable-pip-version-check "maturin==1.13.3" "cffi>=1.17,<2"

      - name: Audit installed Python ReLU layer spec
        run: python3 scripts/audit_python_relu_layer_spec.py

      - name: Upload Python ReLU layer spec report
        uses: actions/upload-artifact@v4
        with:
          name: python-relu-layer-spec-proof-report
          path: python-relu-layer-spec-proof-report.json
          if-no-files-found: error
