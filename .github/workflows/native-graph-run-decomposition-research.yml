name: Native Graph Run Decomposition Research

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "ffi/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/native-graph-run-decomposition-research.yml"
      - "scripts/research_native_graph_run_decomposition.py"
      - "docs/native-graph-run-decomposition-research.md"
  workflow_dispatch:

jobs:
  native-graph-run-decomposition:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research tooling
        run: python3 -m pip install --disable-pip-version-check "maturin==1.13.3" "cffi>=1.17,<2"

      - name: Run same-runner native graph-run decomposition
        run: python3 scripts/research_native_graph_run_decomposition.py

      - name: Upload native graph-run decomposition report
        uses: actions/upload-artifact@v4
        with:
          name: native-graph-run-decomposition-report
          path: native-graph-run-decomposition-report.json
          if-no-files-found: error
