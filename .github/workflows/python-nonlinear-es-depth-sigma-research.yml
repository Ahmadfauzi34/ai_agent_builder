name: Python Nonlinear ES Depth After Sigma Correction Research

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nonlinear-es-depth-sigma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research tooling
        run: python3 -m pip install --disable-pip-version-check "maturin==1.13.3" "cffi>=1.17,<2"

      - name: Run nonlinear ES depth-after-sigma research
        run: python3 scripts/research_python_nonlinear_es_depth_sigma.py

      - name: Upload nonlinear ES depth/sigma report
        uses: actions/upload-artifact@v4
        with:
          name: python-nonlinear-es-depth-sigma-report
          path: python-nonlinear-es-depth-sigma-report.json
          if-no-files-found: error
