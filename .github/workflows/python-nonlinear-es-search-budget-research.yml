name: Python Nonlinear ES Search Budget Research

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nonlinear-es-search-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research tooling
        run: python3 -m pip install --disable-pip-version-check "maturin==1.13.3" "cffi>=1.17,<2"

      - name: Run nonlinear ES search budget research
        run: python3 scripts/research_python_nonlinear_es_search_budget.py

      - name: Upload nonlinear ES search budget report
        uses: actions/upload-artifact@v4
        with:
          name: python-nonlinear-es-search-budget-report
          path: python-nonlinear-es-search-budget-report.json
          if-no-files-found: error
