name: FeatureNorm Phase 2 Patch

on:
  push:
    branches: [ "feat/feature-norm-integration" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/feature-norm-integration

      - name: Narrow patch anchor
        run: python3 scripts/fix_feature_norm_phase2_patch.py

      - name: Keep source push workflow-neutral
        run: python3 scripts/fix_feature_norm_phase2_push.py

      - name: Apply integration patch
        run: python3 scripts/apply_feature_norm_phase2.py

      - name: Format and validate host proof
        run: |
          cargo fmt --all
          python3 -m json.tool docs/agent-layout-contracts.v1.json >/dev/null
          python3 -m json.tool docs/wasm-surface.v1.json >/dev/null
          cargo test --lib --tests

      - name: Commit proven source patch only
        run: |
          rm scripts/apply_feature_norm_phase2.py
          rm scripts/fix_feature_norm_phase2_patch.py
          rm scripts/fix_feature_norm_phase2_push.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/protocol.rs \
            src/layers/custom/feature_norm.rs \
            src/registry.rs \
            src/agent.rs \
            src/contracts.rs \
            src/lib.rs \
            src/feature_norm_integration_tests.rs \
            docs/agent-layout-contracts.v1.json \
            docs/wasm-surface.v1.json \
            scripts/research_feature_norm_integration.mjs
          git add -u scripts/apply_feature_norm_phase2.py scripts/fix_feature_norm_phase2_patch.py scripts/fix_feature_norm_phase2_push.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat: integrate FeatureNorm across agent runtime"
          git push origin HEAD:feat/feature-norm-integration
